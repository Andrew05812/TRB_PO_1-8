sonar.projectKey=dvwa-p5
sonar.projectName=DVWA P5
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Проверяем именно исходники DVWA, а не свою защищённую систему:
# задача практики - найти SQL-инъекцию статическим анализатором.
sonar.sources=vulnerable
sonar.inclusions=**/*.php

# Отчёты и скрипты в анализ не входят.
sonar.exclusions=results/**,scripts/**,burp/**,SecureObjectInfo/**

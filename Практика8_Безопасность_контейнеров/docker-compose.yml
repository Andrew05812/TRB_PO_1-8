services:
  db:
    image: postgres:16-alpine
    container_name: p8-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Именованный том: данные не пропадают при пересоздании контейнера.
      - p8_pgdata:/var/lib/postgresql/data
    networks:
      - p8_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512m
    pids_limit: 200
    cpus: 0.50

  web:
    build: ./app
    image: p8-web:local
    container_name: p8-web
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      # Только loopback: сайт не должен быть доступен всей локальной сети.
      - "127.0.0.1:8088:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - p8_backend
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 256m
    pids_limit: 100
    cpus: 0.50

volumes:
  p8_pgdata:
    name: p8_pgdata

networks:
  p8_backend:
    name: p8_backend
    driver: bridge
